<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SilenceNFT > GIFTS</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Share Tech Mono', monospace;
      background-color: black;
      color: #00a2ff;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      margin-top: 50px;
      text-shadow: 0 0 10px #00a2ff;
      white-space: nowrap;
      overflow: hidden;
      border-right: 2px solid #00a2ff;
      width: 0;
      animation: typing 3s steps(40, end) forwards, blink 0.8s infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 19ch; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .news-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .news-post {
      background-color: rgba(0, 255, 0, 0.05);
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #00a2ff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .news-post:hover {
      transform: scale(1.02);
      box-shadow: 0 0 15px #00a2ff;
      animation: glitch 0.3s infinite;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-1px, 1px); }
      40% { transform: translate(1px, -1px); }
      60% { transform: translate(-1px, 0); }
      80% { transform: translate(1px, 1px); }
      100% { transform: translate(0); }
    }

    .news-post img {
      width: 100%;
      border-radius: 8px;
    }

    .nav-btn {
      background-color: #00a2ff;
      color: black;
      padding: 15px 30px;
      margin: 10px;
      font-size: 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .nav-btn:hover {
      background-color: #0088cc;
      transform: scale(1.1);
    }

    .modal {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>

  <div class="news-container">
    <h1>Available Gifts</h1>

    <button class="nav-btn" onclick="window.location.href='gifts.html'">Go to Gifts</button>
    <button class="nav-btn" onclick="window.location.href='news.html'">Go to News</button>

    <div class="news-post" onclick="sendToTelegram('Bear Giveaway soon')">
      <img src="image1.png" alt="1 MAY">
    </div>
    <div class="news-post" onclick="sendToTelegram('New 1 May Gift')">
      <img src="image2.png" alt="HAPPY BDAY">
    </div>
    <div class="news-post" onclick="sendToTelegram('SilenceNFT START')">
      <img src="image3.gif" alt="SilenceNFT Start">
    </div>
  </div>

  <script>
    const botToken = '8052878806:AAEO-EP0dAWWeiirlKgiY3l_iGNLoi8M0h0';
    const chatId = '8052878806';

    function sendToTelegram(message) {
      const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
      fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ chat_id: chatId, text: message })
      })
      .then(res => res.json())
      .then(data => console.log('Telegram:', data))
      .catch(err => console.error('Telegram Error:', err));
    }

    // Matrix background animation
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;

    const matrix = "01";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#0ff";
      ctx.font = `${fontSize}px 'Share Tech Mono'`;

      for (let i = 0; i < drops.length; i++) {
        const text = matrix[Math.floor(Math.random() * matrix.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(drawMatrix, 33);
  </script>
</body>
</html>
