<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift Shop - Telegram Mini App</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 50px;
            font-size: 36px;
        }

        /* Main Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Buttons */
        .button-container {
            margin-top: 30px;
            display: flex;
            justify-content: space-around;
        }

        .button-container a {
            display: inline-block;
            background-color: #333;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .button-container a:hover {
            background-color: #555;
        }

        /* Footer Section */
        footer {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Gift Shop</h1>
        <p>Explore our collection of gifts and make your selection!</p>

        <div class="button-container">
            <a href="#" id="newsButton">About News</a>
            <a href="#" id="menuButton">Menu (Available Gifts)</a>
        </div>

        <div class="button-container" style="margin-top: 40px;">
            <a href="https://gm0n0.github.io/Silence/" target="_blank">Open Gift Shop</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Gift Shop. All rights reserved.</p>
    </footer>

    <script>
        // Add functionality to the buttons
        document.getElementById('newsButton').addEventListener('click', function() {
            alert("About the News: Stay tuned for the latest updates!");
        });

        document.getElementById('menuButton').addEventListener('click', function() {
            alert("Menu: Available Gifts are being updated regularly!");
        });
    </script>
</body>
</html>
