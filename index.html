<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About News</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Share Tech Mono', monospace;
      background: black;
      color: white;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      margin-top: 50px;
    }

    .news-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .news-post {
      background-color: #222;
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .news-post:hover {
      background-color: #444;
    }

    .news-title {
      font-size: 24px;
      margin: 0;
    }

    .news-summary {
      font-size: 16px;
      color: #ccc;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background-color: #111;
      color: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 700px;
      width: 80%;
      position: relative;
    }

    .modal-content h2 {
      margin-top: 0;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 24px;
      color: white;
      background: none;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <canvas id="matrixCanvas"></canvas>

  <div class="news-container">
    <h1>Latest News</h1>
    <div class="news-post" onclick="openModal('news1')">
      <h2 class="news-title">Bear Giveaway soon</h2>
      <p class="news-summary">Don't miss it out</p>
    </div>
    <div class="news-post" onclick="openModal('news2')">
      <h2 class="news-title">New 1 may gift</h2>
      <p class="news-summary">price:100</p>
    </div>
    <div class="news-post" onclick="openModal('news3')">
      <h2 class="news-title">SilenceNFT START</h2>
      <p class="news-summary">01.05.2025</p>
    </div>
  </div>

  <div id="newsModal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">×</button>
      <h2 id="modalTitle">Title</h2>
      <p id="modalContent">Content</p>
    </div>
  </div>

  <script>
    // Matrix Effect (blue)
    window.onload = function () {
      const canvas = document.getElementById("matrixCanvas");
      const ctx = canvas.getContext("2d");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const characters = "アァカサタナハマヤャラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      const fontSize = 16;
      const columns = Math.floor(canvas.width / fontSize);
      const drops = Array.from({ length: columns }).fill(1);

      function draw() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#00ccff"; // Blue color
        ctx.font = fontSize + "px 'Share Tech Mono'";

        for (let i = 0; i < drops.length; i++) {
          const text = characters[Math.floor(Math.random() * characters.length)];
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);

          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }

      setInterval(draw, 33);
    };

    // News Modal + Telegram
    const botToken = '8052878806:AAEO-EP0dAWWeiirlKgiY3l_iGNLoi8M0h0'; // Replace
    const chatId = '8052878806';     // Replace

    function openModal(newsId) {
      const modal = document.getElementById("newsModal");
      const modalTitle = document.getElementById("modalTitle");
      const modalContent = document.getElementById("modalContent");

      let title = "", content = "";

      if (newsId === "news1") {
        title = "Bear Giveaway soon";
        content = "Don't miss it out";
      } else if (newsId === "news2") {
        title = "New 1 may gift";
        content = "price:100";
      } else if (newsId === "news3") {
        title = "SilenceNFT START";
        content = "01.05.2025";
      }

      modalTitle.textContent = title;
      modalContent.textContent = content;
      modal.style.display = "flex";

      sendToTelegram(`${title}: ${content}`);
    }

    function closeModal() {
      document.getElementById("newsModal").style.display = "none";
    }

    function sendToTelegram(message) {
      const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: chatId, text: message })
      })
      .then(res => res.json())
      .then(data => console.log("Telegram response:", data))
      .catch(err => console.error("Telegram error:", err));
    }
  </script>
</body>
</html>
