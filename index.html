<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About News</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            font-size: 36px;
            margin-top: 50px;
        }

        .news-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* News Post */
        .news-post {
            background-color: #333;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .news-post:hover {
            background-color: #555;
        }

        .news-title {
            font-size: 24px;
            margin: 0;
        }

        .news-summary {
            font-size: 16px;
            color: #ccc;
        }

        /* News Modal (for detailed info) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #171717;
            color: white;
            padding: 30px;
            border-radius: 8px;
            max-width: 700px;
            width: 80%;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div class="news-container">
        <h1>Latest News</h1>
        <div class="news-post" onclick="openModal('news1')">
            <h2 class="news-title">Bear Giveaway soon</h2>
            <p class="news-summary">Dont miss it out</p>
        </div>
        <div class="news-post" onclick="openModal('news2')">
            <h2 class="news-title">New 1 may gift</h2>
            <p class="news-summary">price:100</p>
        </div>
        <div class="news-post" onclick="openModal('news3')">
            <h2 class="news-title">SilenceNFT START</h2>
            <p class="news-summary">01.05.2025</p>
        </div>
    </div>

    <!-- Modal for News Details -->
    <div id="newsModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <h2 id="modalTitle">Title of the News</h2>
            <p id="modalContent">Details about the news post go here...</p>
        </div>
    </div>

    <script>
        // Function to open the modal and show news content
        function openModal(newsId) {
            var modal = document.getElementById("newsModal");
            var modalTitle = document.getElementById("modalTitle");
            var modalContent = document.getElementById("modalContent");

            if (newsId === "news1") {
                modalTitle.textContent = "Bear Giveaway soon";
                modalContent.textContent = "Dont miss it out";
            } else if (newsId === "news2") {
                modalTitle.textContent = "New 1 may gift";
                modalContent.textContent = "price:100";
            } else if (newsId === "news3") {
                modalTitle.textContent = "SilenceNFT START";
                modalContent.textContent = "01.05.2025";
            }

            modal.style.display = "flex"; // Show the modal
        }

        // Function to close the modal
        function closeModal() {
            var modal = document.getElementById("newsModal");
            modal.style.display = "none"; // Hide the modal
        }
    </script>
</body>
</html>
